name: Build Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  # Required by attest-build-provenance to sign the release assets.
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # `npm ci` installs exactly what package-lock.json pins, so the released
      # main.js is reproducible from the tag.
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      # Obsidian installs a plugin from these three files. Anything else in the
      # release is flagged as an unsupported extra asset.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          notes=(--generate-notes)
          if [[ -f "${notes_file}" ]]; then
            notes=(--notes-file "${notes_file}")
          fi
          gh release create "${GITHUB_REF_NAME}" \
            main.js manifest.json styles.css \
            --title "${GITHUB_REF_NAME}" \
            "${notes[@]}" \
            --verify-tag
